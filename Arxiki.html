<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Transliteration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Greek Transliteration</h1>
        <div class="dropdowns">
            <label for="from">From</label>
            <select id="from"></select>
            <label for="to">To</label>
            <select id="to"></select>
        </div>
        <div class="text-boxes">
            <label for="inputText">Enter Text</label>
            <textarea id="inputText" rows="4" cols="50"></textarea>
            <label for="resultText">Transliteration</label>
            <textarea id="resultText" rows="4" cols="50" readonly></textarea>
        </div>
        <button>Transliterate Text</button>
    </div>
    <script src="Translitarator JavaScript.js"></script>
</body>
</html>
