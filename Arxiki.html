<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Μεταγραμματισμός ελληνικών χαρακτήρων σε λατινικούς</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 id="title">Μεταγραμματισμός ελληνικών χαρακτήρων σε λατινικούς</h1>
        <div class="language-switcher">
            <img src="greek-flag.png" alt="Greek" onclick="setLanguage('el')" class="flag">
            <img src="english-flag.png" alt="English" onclick="setLanguage('en')" class="flag">
        </div>
        <form id="transliteration-form">
            <label for="text" id="text-label">Κείμενο</label>
            <input type="text" id="text" placeholder="Εισάγετε το κείμενο για μεταγραμματισμό">
            <div class="checkbox-container">
                <input type="checkbox" id="ancient-greek">
                <label for="ancient-greek" id="ancient-greek-label">Αρχαία ελληνικά</label>
            </div>
            <label for="ala-lc" id="ala-lc-label">ALA-LC romanization</label>
            <div class="input-group">
                <input type="text" id="ala-lc">
                <button type="button" class="copy-button" onclick="copyText('ala-lc')">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <label for="iso843" id="iso843-label">ISO843:1997</label>
            <div class="input-group">
                <input type="text" id="iso843">
                <button type="button" class="copy-button" onclick="copyText('iso843')">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <div class="button-group">
                <button type="button" id="clear-button" onclick="clearForm()">Διαγραφή</button>
                <button type="submit" id="submit-button">Υποβολή</button>
            </div>
        </form>
    </div>
    <script src="Translitarator Javascript.js"></script>
</body>
</html>
