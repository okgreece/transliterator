<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Μεταγραμματισμός ελληνικών χαρακτήρων σε λατινικούς</title>
    <link rel="icon" href="national_library_of_greece.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
</head>
<style>
   .credits-text {
        text-align: center;
        font-size: 0.9em;
        color: #666;
        margin-top: 5px;
        line-height: 1.5;
    }

    .top-bar span {
        font-family: 'Noto Sans', sans-serif;
        font-size: 16px;
        cursor: pointer;
        color: #333;
        transition: color 0.3s, text-decoration 0.3s ease-in-out;
    }

    .top-bar span:hover {
        color: #000000;
        text-decoration: underline;
    }

    .separator {
        color: #ccc;
        margin: 0 10px;
    }
</style>
<body>
<div class="container">
    <!-- Library Logo with Link -->
    <a href="#" class="logo">
        <img src="transilteration_logo_white.png" alt="National Library of Greece">
    </a>

    <div class="top-bar">
        <span id="about" onclick="navigateTo('about')" title="Σχετικά">Σχετικά</span>
        <span class="separator"></span>
        <span id="help" onclick="navigateTo('help')" title="Βοήθεια">Βοήθεια</span>
    </div>

    <div class="language-selection">
        <span id="greek-language" onclick="setLanguage('el')" title="Ελληνικά">EL</span>
        <span class="separator">|</span>
        <span id="english-language" onclick="setLanguage('en')" title="English">EN</span>
    </div>

    <h1 id="title" style="font-family: 'Noto Sans', sans-serif;">Μεταγραμματισμός ελληνικών χαρακτήρων σε λατινικούς</h1>

    <form id="transliteration-form">
        <div class="form-section">
            <div class="text-input-section">
                <label for="text" id="text-label">Κείμενο</label>
                <input type="checkbox" id="ancient-greek">
                <label for="ancient-greek" id="ancient-greek-label">Αρχαία ελληνικά</label>
                <div class="textarea-container">
                    <textarea id="text"  style="height: 277px;" placeholder="Εισάγετε το κείμενο για μεταγραμματισμό"></textarea>
                </div>
                <div class="button-container">
                    <button type="button" id="clear-button" onclick="clearForm()">Καθαρισμός</button>
                </div>
            </div>
            <div class="result-section">
                <div class="output-box">
                    <label for="ala-lc" id="ala-lc-label">ALA-LC Romanization</label>
                    <div class="input-group">
                        <textarea id="ala-lc" readonly></textarea>
                        <button type="button" class="copy-button" id="copy-ala-lc" onclick="copyText('ala-lc')">Copy</button>
                    </div>
                </div>

                <div class="output-box">
                    <label for="iso843" id="iso843-label">ISO 843:1997</label>
                    <div class="input-group">
                        <textarea id="iso843" readonly></textarea>
                        <button type="button" class="copy-button" id="copy-iso843" onclick="copyText('iso843')">Copy</button>
                    </div>
                </div>
                <button type="submit" id="submit-button">Υποβολή</button>
            </div>
        </div>
    </form>

    <footer>
        <p class="disclaimer" id="disclaimer"></p>
    </footer>
</div>
<script src="Transliterator_Javascript.js"></script>
</body>
</html>
